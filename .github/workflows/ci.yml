name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# GitHub-hosted runners only: this repository is public, so no job may reach a
# self-hosted runner, and no job reads a secret.
jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: No dependencies
        run: node -e "const p=require('./package.json'); for (const k of ['dependencies','devDependencies','optionalDependencies','peerDependencies']) if (p[k] && Object.keys(p[k]).length) { console.error('package.json must not declare ' + k); process.exit(1); }"
      - run: npm test
